
name: Gerar APK Android

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extrair projeto
        run: |
          unzip -o *.zip -d extracted
          find extracted -name build.gradle -print

      - name: Compilar APK
        run: |
          PROJECT=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          gradle -p "$PROJECT" --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SeasOfMayhem-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
